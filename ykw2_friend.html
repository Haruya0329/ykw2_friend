        const inputEl = document.getElementById('yokaiInput');
        const suggestListEl = document.getElementById('suggestList');
        const searchBtn = document.getElementById('searchBtn');
        const resultText = document.getElementById('resultText');
        const resultBox = document.getElementById('resultBox');

        let currentFocus = -1;
        let currentSuggestions = [];

        // 文字列の正規化（カタカナをひらがなに変換、英大文字を小文字に）
        function normalizeString(str) {
            return str.replace(/[\u30a1-\u30f6]/g, function(match) {
                const chr = match.charCodeAt(0) - 0x60;
                return String.fromCharCode(chr);
            }).toLowerCase();
        }

        // サジェストリストの表示・更新
        function updateSuggestList(query) {
            suggestListEl.innerHTML = '';
            currentFocus = -1;
            
            if (!query) {
                suggestListEl.classList.add('hidden');
                currentSuggestions = [];
                return;
            }

            const normalizedQuery = normalizeString(query);
            
            // 名前かよみがなに部分一致するものをフィルタリング（最大15件まで表示）
            currentSuggestions = yokaiList.filter(y => {
                return normalizeString(y.name).includes(normalizedQuery) || 
                       y.kana.includes(normalizedQuery);
            }).slice(0, 15);

            if (currentSuggestions.length > 0) {
                suggestListEl.classList.remove('hidden');
                
                currentSuggestions.forEach((yokai, index) => {
                    const li = document.createElement('li');
                    li.className = 'px-4 py-2 cursor-pointer text-gray-700 hover:bg-blue-50 transition-colors border-b last:border-b-0 border-gray-100 flex justify-between items-center';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = yokai.name;
                    nameSpan.className = 'font-medium';
                    
                    const kanaSpan = document.createElement('span');
                    kanaSpan.textContent = yokai.kana;
                    kanaSpan.className = 'text-xs text-gray-400 ml-2';
                    
                    li.appendChild(nameSpan);
                    li.appendChild(kanaSpan);

                    li.addEventListener('click', () => {
                        inputEl.value = yokai.name;
                        suggestListEl.classList.add('hidden');
                        performSearch();
                    });
                    
                    suggestListEl.appendChild(li);
                });
            } else {
                suggestListEl.classList.add('hidden');
            }
        }

        // キーボード操作のアクティブ状態を更新
        function setActiveSuggestion(items) {
            if (!items || items.length === 0) return;
            // リセット
            Array.from(items).forEach(item => item.classList.remove('bg-blue-100'));
            
            if (currentFocus >= items.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = (items.length - 1);
            
            items[currentFocus].classList.add('bg-blue-100');
            // スクロール追従
            items[currentFocus].scrollIntoView({ block: 'nearest' });
        }

        // 入力時のイベント
        inputEl.addEventListener('input', function() {
            updateSuggestList(this.value);
        });

        // キーボード操作のイベント
        inputEl.addEventListener('keydown', function(e) {
            const items = suggestListEl.getElementsByTagName('li');
            
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentFocus++;
                setActiveSuggestion(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentFocus--;
                setActiveSuggestion(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (currentFocus > -1 && !suggestListEl.classList.contains('hidden')) {
                    // サジェストが選択されている場合はそれを選ぶ
                    if (items[currentFocus]) {
                        items[currentFocus].click();
                    }
                } else {
                    // 選択されていなければ検索を実行
                    suggestListEl.classList.add('hidden');
                    performSearch();
                }
            }
        });

        // 外部クリックでサジェストを閉じる
        document.addEventListener('click', function (e) {
            if (e.target !== inputEl && e.target !== suggestListEl) {
                suggestListEl.classList.add('hidden');
            }
        });

        // フォーカス時にリストを再表示
        inputEl.addEventListener('focus', function() {
            if (this.value) {
                updateSuggestList(this.value);
            }
        });

        function performSearch() {
            const query = inputEl.value.trim();
            
            resultBox.classList.remove('bg-blue-50', 'border-blue-300', 'bg-red-50', 'border-red-300');
            
            if (query === "") {
                resultText.textContent = "名前を入力してください";
                resultText.className = "text-xl font-medium text-gray-500";
                resultBox.classList.add('bg-gray-50', 'border-gray-300');
                return;
            }

            if (yokaiMap.has(query)) {
                const value = yokaiMap.get(query);
                resultText.textContent = value;
                resultText.className = "text-5xl font-extrabold text-blue-600 tracking-wider";
                resultBox.classList.remove('bg-gray-50', 'border-gray-300');
                resultBox.classList.add('bg-blue-50', 'border-blue-300');
            } else {
                resultText.textContent = "見つかりません";
                resultText.className = "text-2xl font-bold text-red-500";
                resultBox.classList.remove('bg-gray-50', 'border-gray-300');
                resultBox.classList.add('bg-red-50', 'border-red-300');
            }
        }

        searchBtn.addEventListener('click', () => {
            suggestListEl.classList.add('hidden');
            performSearch();
        });

    </script>
</body>
</html>
